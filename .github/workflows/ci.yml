name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate harness backlog
        run: node scripts/harness-check.mjs
      - name: Build and test iOS app when present
        shell: bash
        run: |
          if [[ -d MojaSzafa.xcodeproj ]]; then
            xcodebuild test \
              -project MojaSzafa.xcodeproj \
              -scheme MojaSzafa \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16'
          else
            echo 'Projekt Xcode powstanie w T005; walidacja backlogu jest zielona.'
          fi

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Test fresh and previous-version database migrations
        run: bash scripts/test-database.sh
