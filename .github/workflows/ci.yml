name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# New commits supersede older checks for the same PR, without cancelling other PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/gateway/package-lock.json
      - name: Install operations panel dependencies
        run: npm ci --prefix backend/operations --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned gateway dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix backend/gateway
      - name: Provision image decoder for tests
        run: python3 -m pip install -r backend/images/requirements.txt
      - name: Validate repository, environment guards and secrets
        run: |
          node --test scripts/select-ios-simulator.test.mjs
          python3 -m unittest discover -s scripts -p 'test_clone_ios_simulator.py'
          python3 -m unittest discover -s scripts -p 'test_bounded_command.py'
          python3 -m unittest discover -s scripts -p 'test_summarize_performance.py'
          node scripts/harness-check.mjs

  ios:
    needs: validate
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Limit resource use per workflow; each job owns its simulator across concurrent runs.
      max-parallel: 1
      matrix:
        configuration: [Debug, Staging, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show toolchain
        run: xcodebuild -version
      - name: Test crash-symbol archiving and symbolication
        if: matrix.configuration == 'Release'
        run: python3 scripts/test_crash_symbols.py
      - name: Clone isolated iPhone simulator from blank template
        id: simulator
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          selection="$(xcrun simctl list runtimes -j | node scripts/select-ios-simulator.mjs)"
          read -r device_type runtime <<< "$selection"
          simulator_name="MojaSzafa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${BUILD_CONFIGURATION}"
          SIMULATOR_ID="$(python3 scripts/clone-ios-simulator.py \
            --name "$simulator_name" --device-type "$device_type" --runtime "$runtime" \
            --github-output "$GITHUB_OUTPUT")"
          echo "Cloned simulator $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build and test environment
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          echo "Using simulator $SIMULATOR_ID"
          case "$BUILD_CONFIGURATION" in
            Debug) STOREKIT_SCHEME=MojaSzafaStoreKit ;;
            Staging|Release) STOREKIT_SCHEME="MojaSzafaStoreKit$BUILD_CONFIGURATION" ;;
            *) echo "Unsupported configuration: $BUILD_CONFIGURATION" >&2; exit 1 ;;
          esac
          xcodebuild build-for-testing \
            -project MojaSzafa.xcodeproj -scheme "$STOREKIT_SCHEME" \
            -configuration "$BUILD_CONFIGURATION" -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          # Provision local StoreKit before launching the purchase-test host.
          # This step never buys a product; the subsequent suite must still
          # complete and verify the real local StoreKit purchase.
          # Cold test-host startup can take about 90 seconds, so allow 300 seconds
          # here instead of timing out just as XCTest begins.
          provision_storekit() {
            python3 scripts/bounded-command.py --timeout 300 -- xcodebuild test-without-building \
              -project MojaSzafa.xcodeproj -scheme "$STOREKIT_SCHEME" \
              -configuration "$BUILD_CONFIGURATION" -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -only-testing:MojaSzafaTests/SubscriptionStoreKitTests/testProvisionLocalStoreKitConfiguration \
              -resultBundlePath "$RUNNER_TEMP/$BUILD_CONFIGURATION-storekit-setup.xcresult" \
              CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          }
          if ! provision_storekit 2>&1 | tee "$RUNNER_TEMP/storekit-setup.log"; then
            # Fresh clones can stall before XCTest starts. Retry only that
            # infrastructure failure, never a started/failed provisioning test.
            if grep -q 'Test Case .*started\|Test case .*started\|Test Case .*failed\|Test case .*failed' "$RUNNER_TEMP/storekit-setup.log"; then
              exit 1
            fi
            grep -q 'Application failed preflight checks\|failed to launch\|CI command timed out' "$RUNNER_TEMP/storekit-setup.log" || exit 1
            if [[ -d "$RUNNER_TEMP/$BUILD_CONFIGURATION-storekit-setup.xcresult" ]]; then
              mv "$RUNNER_TEMP/$BUILD_CONFIGURATION-storekit-setup.xcresult" "$RUNNER_TEMP/$BUILD_CONFIGURATION-storekit-setup.first-attempt.xcresult"
            fi
            echo "Provisioning host did not start; rebooting the owned simulator once"
            xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
            xcrun simctl boot "$SIMULATOR_ID"
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            provision_storekit
          fi
          run_tests() {
            python3 scripts/bounded-command.py --timeout 300 -- xcodebuild test-without-building \
              -project MojaSzafa.xcodeproj -scheme "$STOREKIT_SCHEME" \
              -configuration "$BUILD_CONFIGURATION" \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/$BUILD_CONFIGURATION.xcresult" \
              CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          }
          if ! run_tests 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            grep -q 'Application failed preflight checks\|failed to launch\|CI command timed out' "$RUNNER_TEMP/xcodebuild.log" || exit 1
            echo "Simulator launch failure or test timeout; rebooting owned simulator and retrying once"
            if [[ -d "$RUNNER_TEMP/$BUILD_CONFIGURATION.xcresult" ]]; then
              mv "$RUNNER_TEMP/$BUILD_CONFIGURATION.xcresult" "$RUNNER_TEMP/$BUILD_CONFIGURATION.first-attempt.xcresult"
            fi
            xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
            xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            run_tests
          fi
      - name: Build production without testability override
        if: matrix.configuration == 'Release'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MojaSzafa.xcodeproj -scheme MojaSzafa -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ProductionBuild" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iOS device symbols
        if: matrix.configuration == 'Release'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MojaSzafa.xcodeproj -scheme MojaSzafa -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceSymbols" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package app and widget dSYMs with UUID manifests
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        shell: bash
        run: |
          set -euo pipefail
          collect_dsyms() {
            local products_dir="$1"
            local output_dir="$2"
            local manifest="$output_dir/UUID-manifest.txt"
            mkdir -p "$output_dir"
            : > "$manifest"
            for name in "MojaSzafa.app.dSYM" "MojaSzafaWidget.appex.dSYM"; do
              local bundle="$products_dir/$name"
              if [[ ! -d "$bundle" ]]; then
                echo "Missing required dSYM: $bundle" >&2
                return 1
              fi
              ditto "$bundle" "$output_dir/$name"
              local before_count
              before_count="$(wc -l < "$manifest")"
              local dwarf_binary
              for dwarf_binary in "$bundle"/Contents/Resources/DWARF/*; do
                [[ -f "$dwarf_binary" ]] || continue
                local line uuid architecture
                while IFS= read -r line; do
                  uuid="$(awk '{print $2}' <<< "$line")"
                  architecture="$(sed -E 's/.*\(([^)]*)\).*/\1/' <<< "$line")"
                  printf '%s\t%s\t%s\n' "$name" "$architecture" "$uuid" >> "$manifest"
                done < <(xcrun dwarfdump --uuid "$dwarf_binary")
              done
              local after_count
              after_count="$(wc -l < "$manifest")"
              if (( after_count <= before_count )); then
                echo "No UUIDs found for dSYM: $bundle" >&2
                return 1
              fi
            done
          }
          collect_dsyms \
            "$RUNNER_TEMP/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphonesimulator" \
            "$RUNNER_TEMP/CrashSymbols/simulator-${BUILD_CONFIGURATION}"
          if [[ "$BUILD_CONFIGURATION" == "Release" ]]; then
            collect_dsyms \
              "$RUNNER_TEMP/ProductionBuild/Build/Products/Release-iphonesimulator" \
              "$RUNNER_TEMP/CrashSymbols/simulator-production"
            collect_dsyms \
              "$RUNNER_TEMP/DeviceSymbols/Build/Products/Release-iphoneos" \
              "$RUNNER_TEMP/CrashSymbols/ios-device"
          fi
      - name: Preserve simulator dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.sha }}-ios-simulator-${{ matrix.configuration }}
          path: ${{ runner.temp }}/CrashSymbols/simulator-${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 30
      - name: Preserve production simulator dSYMs
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.sha }}-ios-simulator-production
          path: ${{ runner.temp }}/CrashSymbols/simulator-production
          if-no-files-found: error
          retention-days: 30
      - name: Preserve iOS device dSYMs
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.sha }}-ios-device-release
          path: ${{ runner.temp }}/CrashSymbols/ios-device
          if-no-files-found: error
          retention-days: 30
      - name: Delete job simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_ID"
      - name: Preserve XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.configuration }}
          path: ${{ runner.temp }}/${{ matrix.configuration }}*.xcresult
          if-no-files-found: warn
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned gateway database driver
        run: npm ci --prefix backend/gateway --ignore-scripts --no-audit --no-fund
      - name: Install operations panel dependencies
        run: npm ci --prefix backend/operations --ignore-scripts --no-audit --no-fund
      - name: Test backend migrations when present
        shell: bash
        run: |
          if [[ -f backend/tests/run-tests.sh ]]; then
            bash backend/tests/run-tests.sh
            GATEWAY_PG_TESTS=1 node --test backend/gateway/postgres.test.mjs
            OPS_PG_TESTS=1 node --test backend/operations/postgres.test.mjs
          else
            echo 'Testy migracji powstaną w T008 (backend/tests/run-tests.sh).'
          fi
