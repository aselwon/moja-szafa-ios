name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate harness backlog
        run: node scripts/harness-check.mjs
      - name: Build and test iOS app when present
        shell: bash
        run: |
          if [[ -d MojaSzafa.xcodeproj ]]; then
            # Runner images rotate simulators (e.g. iPhone 16 -> 17), so pick the first available iPhone.
            SIMULATOR_ID="$(xcrun simctl list devices available -j \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).devices;for(const k of Object.keys(r).filter(k=>k.includes("iOS")).sort().reverse()){const d=r[k].find(x=>x.isAvailable!==false&&x.name.startsWith("iPhone"));if(d){console.log(d.udid);return}}process.exit(1)})')"
            echo "Using simulator $SIMULATOR_ID"
            xcodebuild test \
              -project MojaSzafa.xcodeproj \
              -scheme MojaSzafa \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          else
            echo 'Projekt Xcode powstanie w T005; walidacja backlogu jest zielona.'
          fi
