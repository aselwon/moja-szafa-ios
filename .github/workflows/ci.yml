name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision image decoder for tests
        run: python3 -m pip install -r backend/images/requirements.txt
      - name: Validate repository, environment guards and secrets
        run: |
          node --test scripts/select-ios-simulator.test.mjs
          node scripts/harness-check.mjs

  ios:
    needs: validate
    runs-on: [self-hosted, macOS, ios]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Limit resource use per workflow; each job owns its simulator across concurrent runs.
      max-parallel: 1
      matrix:
        configuration: [Debug, Staging, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show toolchain
        run: xcodebuild -version
      - name: Create isolated iPhone simulator
        id: simulator
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          selection="$(xcrun simctl list runtimes -j | node scripts/select-ios-simulator.mjs)"
          read -r device_type runtime <<< "$selection"
          simulator_name="MojaSzafa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${BUILD_CONFIGURATION}"
          SIMULATOR_ID="$(xcrun simctl create "$simulator_name" "$device_type" "$runtime")"
          # Persist ownership before boot so cleanup also runs after boot failures.
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "Created simulator $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build and test environment
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          echo "Using simulator $SIMULATOR_ID"
          run_tests() {
            xcodebuild test \
              -project MojaSzafa.xcodeproj -scheme MojaSzafa \
              -configuration "$BUILD_CONFIGURATION" \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -resultBundlePath "$RUNNER_TEMP/$BUILD_CONFIGURATION.xcresult" \
              CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          }
          if ! run_tests 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"; then
            grep -q 'Application failed preflight checks\|failed to launch' "$RUNNER_TEMP/xcodebuild.log" || exit 1
            echo "Simulator launch flake; rebooting simulator and retrying once"
            rm -rf "$RUNNER_TEMP/$BUILD_CONFIGURATION.xcresult"
            xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
            xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            run_tests
          fi
      - name: Build production without testability override
        if: matrix.configuration == 'Release'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MojaSzafa.xcodeproj -scheme MojaSzafa -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ProductionBuild" \
            CODE_SIGNING_ALLOWED=NO
      - name: Delete job simulator
        if: always() && steps.simulator.outputs.id != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl delete "$SIMULATOR_ID"
      - name: Preserve XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.configuration }}
          path: ${{ runner.temp }}/${{ matrix.configuration }}.xcresult
          if-no-files-found: warn
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Test backend migrations when present
        shell: bash
        run: |
          if [[ -f backend/tests/run-tests.sh ]]; then
            bash backend/tests/run-tests.sh
          else
            echo 'Testy migracji powstaną w T008 (backend/tests/run-tests.sh).'
          fi
